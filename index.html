<style>
/* Layout: a narrow single column meant to sit beside the app; sticky header with row jump, fixed prev/next bar for the thumb. */
:root {
  --bg: #f4f7f3;
  --surface: #ffffff;
  --ink: #16201a;
  --muted: #5a6a5e;
  --line: #d9e1d8;
  --accent: #2e7a34;
  --accent-ink: #ffffff;
  --accent-soft: #e2efdf;
  --type-bg: #fff3c9;
  --type-ink: #5a4300;
  --type-line: #e9d58a;
  --see: #24577a;
  --see-soft: #e4eef5;
  --warn-soft: #fdeee6;
  --warn-ink: #8a3a12;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1411; --surface: #161d18; --ink: #e4ebe4; --muted: #9aa99d; --line: #29332c;
    --accent: #72c46e; --accent-ink: #0c160d; --accent-soft: #1c2d1d;
    --type-bg: #3a3214; --type-ink: #f4dc8a; --type-line: #5c4f1f;
    --see: #8cc3ea; --see-soft: #18262f; --warn-soft: #36211a; --warn-ink: #f2b394;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1411; --surface: #161d18; --ink: #e4ebe4; --muted: #9aa99d; --line: #29332c;
  --accent: #72c46e; --accent-ink: #0c160d; --accent-soft: #1c2d1d;
  --type-bg: #3a3214; --type-ink: #f4dc8a; --type-line: #5c4f1f;
  --see: #8cc3ea; --see-soft: #18262f; --warn-soft: #36211a; --warn-ink: #f2b394;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 620px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
header.top .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; }
.home-btn {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  font: 600 13px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase;
  color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 6px; padding: 8px 10px; cursor: pointer;
}
.crumb { flex: 1; min-width: 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.jump { display: flex; align-items: center; gap: 4px; flex: none; }
.jump label { font-size: 12px; color: var(--muted); }
.jump input {
  width: 3.6em; font: 500 15px var(--font-mono); padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--bg); color: var(--ink);
}
.jump button { font: 600 13px var(--font-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 8px; cursor: pointer; }
.jump-msg { font-size: 12px; color: var(--warn-ink); }

main { padding-block: 16px 96px; }

/* index */
.hero h1 { font: 600 28px/1.15 var(--font-display); margin: 4px 0 6px; text-wrap: balance; }
.hero p { margin: 0 0 6px; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-see { color: var(--see); font-weight: 600; }
.sec { margin-top: 22px; }
.sec h2 {
  font: 600 13px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px;
}
.sec h2 small { font: 500 12px var(--font-mono); letter-spacing: 0; text-transform: none; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.list li + li { border-top: 1px solid var(--line); }
.list a { display: grid; grid-template-columns: 6.4em 1fr auto; gap: 10px; align-items: center; padding: 11px 12px; color: inherit; text-decoration: none; }
.list a:hover, .list a:focus-visible { background: var(--accent-soft); outline: none; }
.rowtag { font: 500 12px/1.25 var(--font-mono); color: var(--accent); font-variant-numeric: tabular-nums; }
.ltitle { min-width: 0; }
.ltitle b { display: block; font-weight: 500; }
.ltitle small { color: var(--muted); font-size: 12px; }
.prog { font: 500 12px var(--font-mono); color: var(--muted); white-space: nowrap; }
.prog.done { color: var(--accent); }

/* case page */
.eyebrow { font: 600 12px/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.rowpill { font: 500 12px var(--font-mono); letter-spacing: 0; text-transform: none; color: var(--accent-ink); background: var(--accent); border-radius: 4px; padding: 3px 6px; }
h1.case { font: 600 26px/1.15 var(--font-display); margin: 8px 0 8px; text-wrap: balance; }
.ask { margin: 0 0 14px; color: var(--muted); }
.eo { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 14px; font-size: 14px; }
.eo summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.eo-row { margin-top: 10px; }
.eo-row p { margin: 0; }
.eo-row ul { margin: 4px 0 0; padding-left: 20px; color: var(--muted); }
.eo-ref { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-right: 4px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 14px; font-size: 14px; }
.facts dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.facts dd { margin: 0; min-width: 0; }
.note { border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 0 0 14px; }
.note.warn { background: var(--warn-soft); color: var(--warn-ink); }
.note.info { background: var(--see-soft); color: var(--ink); }
.note b { font-weight: 600; }
h3.part { font: 600 14px/1 var(--font-display); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
h3.part button { font: 500 12px var(--font-body); text-transform: none; letter-spacing: 0; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
ol.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 10px 44px; position: relative; counter-increment: s; }
ol.steps li.opt { border-style: dashed; }
ol.steps li .tick {
  position: absolute; left: 10px; top: 10px; width: 24px; height: 24px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--bg); color: var(--muted);
  font: 500 12px/21px var(--font-mono); text-align: center; cursor: pointer; padding: 0;
}
ol.steps li .tick::before { content: counter(s); }
ol.steps ul.see li { counter-increment: none; }
ol.steps li.done { opacity: .55; }
ol.steps li.done .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
ol.steps li.done .tick::before { content: "✓"; }
.do { margin: 0; }
.proof { display: inline-block; font: 600 11px var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent); border-radius: 999px; padding: 1px 8px; white-space: nowrap; vertical-align: 1px; }
.optlabel { font: 600 11px var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
ul.see { list-style: none; margin: 8px 0 0; padding: 8px 10px; background: var(--see-soft); border-radius: 6px; display: grid; gap: 4px; font-size: 14px; }
ul.see li { padding-left: 18px; position: relative; }
ul.see li::before { content: "→"; position: absolute; left: 0; color: var(--see); font-weight: 600; }
.say { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; padding: 10px 12px; margin: 0; display: grid; gap: 8px; font-size: 14px; }
.say p { margin: 0; }

/* inline tokens */
.ui { font: 500 .92em var(--font-body); border: 1px solid var(--line); background: var(--bg); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.val {
  font: 500 .9em var(--font-mono); background: var(--type-bg); color: var(--type-ink); border: 1px solid var(--type-line);
  border-radius: 5px; padding: 0 5px; cursor: copy; word-break: break-all;
}
.val.copied, .path.copied { outline: 2px solid var(--accent); }
a.path { font: 500 .88em var(--font-mono); color: var(--see); word-break: break-all; }
code { font: .9em var(--font-mono); }

/* login card */
.logins { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.logins th, .logins td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
.logins th { font: 600 12px var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-top: 0; }
.tablewrap { overflow-x: auto; }
.field { display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.field label { font-weight: 500; }
.field input { font: 15px var(--font-mono); padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); width: 100%; }
.field small { color: var(--muted); }
.p { margin: 0 0 10px; }

/* bottom bar */
nav.pager {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.pager .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-block: 8px; }
nav.pager a {
  display: grid; gap: 1px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  color: var(--ink); text-decoration: none; min-width: 0;
}
nav.pager a.next { text-align: right; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
nav.pager a small { font: 600 11px var(--font-display); letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
nav.pager a span { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav.pager a[aria-disabled="true"] { visibility: hidden; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<header class="top">
  <div class="wrap">
    <button class="home-btn" id="homeBtn" type="button" aria-label="Back to the index">☰ Index</button>
    <div class="crumb" id="crumb"></div>
    <form class="jump" id="jumpForm" autocomplete="off">
      <label for="jumpInput">Row</label>
      <input id="jumpInput" inputmode="numeric" pattern="[0-9]*" placeholder="41" aria-label="Jump to checklist row">
      <button type="submit">Go</button>
    </form>
  </div>
  <div class="wrap"><div class="jump-msg" id="jumpMsg" hidden></div></div>
</header>

<main class="wrap" id="view"></main>

<nav class="pager" id="pager" aria-label="Previous and next page">
  <div class="wrap">
    <a id="prevLink" class="prev" href="#index"><small>‹ Previous</small><span></span></a>
    <a id="nextLink" class="next" href="#index"><small>Next ›</small><span></span></a>
  </div>
</nav>

/* ---------------- rendering ---------------- */
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let done = store.get('eo-demo-done', {});

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmt(s) {
  // tokenise before escaping so markup survives
  const parts = [];
  const re = /\[\[(.+?)\]\]|\{\{(.+?)\}\}|<<(.*?)>>|\*\*(.+?)\*\*|\s*\(\((rows? [^)]+)\)\)/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    parts.push(esc(s.slice(last, m.index)));
    if (m[1] != null) parts.push(`<span class="ui">${esc(m[1])}</span>`);
    else if (m[2] != null) parts.push(`<span class="val" role="button" tabindex="0" title="Tap to copy" data-copy="${esc(m[2])}">${esc(m[2])}</span>`);
    else if (m[3] != null) parts.push(`<span class="path">${esc(m[3])}</span>`);
    else if (m[4] != null) parts.push(`<b>${esc(m[4])}</b>`);
    else parts.push(` <span class="proof" title="EO checklist row proven here">✓ ${esc(m[5].charAt(0).toUpperCase() + m[5].slice(1))}</span>`);
    last = re.lastIndex;
  }
  parts.push(esc(s.slice(last)));
  return parts.join('');
}
// every row, with runs of three or more shown as a range: 20–23, 65
function rowList(r) {
  const out = [];
  for (let i = 0; i < r.length; ) {
    let j = i;
    while (j + 1 < r.length && r[j + 1] === r[j] + 1) j++;
    if (j - i >= 2) out.push(r[i] + '–' + r[j]);
    else for (let k = i; k <= j; k++) out.push(String(r[k]));
    i = j + 1;
  }
  return out.join(', ');
}
function rowLabel(c) {
  if (!c.rows.length) return 'Setup';
  return (c.rows.length === 1 ? 'Row ' : 'Rows ') + rowList(c.rows);
}
function shortRows(c) {
  return c.rows.length ? rowList(c.rows) : '—';
}
function secName(id) { return (SECTIONS.find((s) => s[0] === id) || [, ''])[1]; }
function allSteps(c) { return [...(c.prep || []), ...(c.steps || [])]; }
function progress(c) {
  const n = allSteps(c).length;
  const d = (done[c.id] || []).filter(Boolean).length;
  return { n, d };
}

function renderIndex() {
  $('crumb').textContent = 'EO evaluation demo';
  let h = `<div class="hero">
    <h1>Elections Ontario evaluation demo</h1>
    <p>This walkthrough follows the demo from start to finish. Each page lists the steps done in the app and what each step should show. A page can cover several checklist rows, and a few rows are shown out of numeric order where they fit the flow of the demo. A green badge marks the exact step that proves each row. To find a row, type its number in the Row box at the top. Each page also has an "EO checklist wording" box with the row's text from the evaluation tool.</p>
    <div class="legend">
      <span><span class="ui">Button</span> in the app</span>
      <span><span class="val">value</span> text entered in the demo</span>
      <span><span class="path">/path</span> a page in the app</span>
      <span><span class="lg-see">→</span> what the step should show</span>
      <span><span class="proof">✓ Row 14</span> this step proves checklist row 14</span>
    </div>
  </div>`;
  for (const [sid, sname] of SECTIONS) {
    const items = CASES.filter((c) => c.sec === sid);
    const rows = items.flatMap((c) => c.rows);
    const range = rows.length ? `rows ${rowList([...rows].sort((a, b) => a - b))}` : '';
    h += `<section class="sec"><h2><span>${esc(sname)}</span><small>${range}</small></h2><ul class="list">`;
    for (const c of items) {
      const p = progress(c);
      const who = (c.who || []).join(', ');
      const status = p.n ? `<span class="prog${p.d === p.n ? ' done' : ''}">${p.d === p.n ? '✓ done' : p.d ? p.d + '/' + p.n : (c.mins || '')}</span>` : '<span class="prog"></span>';
      h += `<li><a href="#${c.id}"><span class="rowtag">${esc(shortRows(c))}</span><span class="ltitle"><b>${esc(c.title)}</b><small>${esc(who)}</small></span>${status}</a></li>`;
    }
    h += `</ul></section>`;
  }
  h += `<p class="p" style="margin-top:20px;color:var(--muted);font-size:13px">Ticks are saved in this browser only. <button type="button" id="resetAll" class="jump" style="all:unset;text-decoration:underline;cursor:pointer">Clear all ticks</button></p>`;
  $('view').innerHTML = h;
  $('resetAll').onclick = () => { done = {}; store.set('eo-demo-done', done); renderIndex(); };
  setPager(-1);
}

function stepHtml(cid, i, st) {
  const isDone = (done[cid] || [])[i];
  const see = st.s ? `<ul class="see">${st.s.map((x) => `<li>${fmt(x)}</li>`).join('')}</ul>` : '';
  return `<li class="${st.opt ? 'opt' : ''}${isDone ? ' done' : ''}" data-i="${i}">
    <button class="tick" type="button" aria-label="Mark step ${i + 1} done" aria-pressed="${isDone ? 'true' : 'false'}"></button>
    <p class="do">${st.opt ? '<span class="optlabel">Optional</span>' : ''}${fmt(st.d)}</p>${see}</li>`;
}

function eoBox(c) {
  const items = (c.rows || []).filter((n) => EO[n]).map((n) => {
    const e = EO[n];
    const ex = e.ex.length ? `<ul>${e.ex.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
    return `<div class="eo-row"><p><span class="eo-ref">Row ${n} · ${esc(e.ref)}</span> ${esc(e.q)}</p>${ex}</div>`;
  });
  return items.length ? `<details class="eo"><summary>EO checklist wording</summary>${items.join('')}</details>` : '';
}

function renderCase(c) {
  $('crumb').textContent = `${rowLabel(c)} · ${secName(c.sec)}`;
  let h = `<div class="eyebrow"><span class="rowpill">${esc(rowLabel(c))}</span><span>${esc(secName(c.sec))}</span></div>
  <h1 class="case">${esc(c.title)}</h1>
  <p class="ask">${fmt(c.ask || '')}</p>
  ${eoBox(c)}
  <dl class="facts">
    <dt>Signed in as</dt><dd>${esc((c.who || []).join(', '))}</dd>
    ${c.start ? `<dt>Start at</dt><dd><span class="path">${esc(c.start)}</span></dd>` : ''}
    ${c.mins ? `<dt>Time</dt><dd>${esc(c.mins)}</dd>` : ''}
  </dl>`;
  const prepN = (c.prep || []).length;
  if (prepN) {
    h += `<h3 class="part"><span>Before the meeting</span></h3><ol class="steps" data-case="${c.id}">${c.prep.map((st, i) => stepHtml(c.id, i, st)).join('')}</ol>`;
  }
  h += `<h3 class="part"><span>${prepN ? 'In the meeting' : 'Demo steps'}</span><button type="button" id="resetCase">Clear ticks</button></h3>
  <ol class="steps" data-case="${c.id}" style="counter-reset:s">${c.steps.map((st, i) => stepHtml(c.id, prepN + i, st)).join('')}</ol>`;
  $('view').innerHTML = h;
  $('resetCase').onclick = () => { delete done[c.id]; store.set('eo-demo-done', done); renderCase(c); };
}

function setPager(idx) {
  const prev = idx > 0 ? CASES[idx - 1] : null;
  const next = idx < 0 ? CASES[0] : CASES[idx + 1];
  const pl = $('prevLink'), nl = $('nextLink');
  if (idx < 0) { pl.setAttribute('aria-disabled', 'true'); }
  else {
    pl.removeAttribute('aria-disabled');
    pl.href = prev ? '#' + prev.id : '#index';
    pl.querySelector('span').textContent = prev ? `${shortRows(prev) === '—' ? '' : shortRows(prev) + ' · '}${prev.title}` : 'Index';
  }
  if (next) {
    nl.removeAttribute('aria-disabled');
    nl.href = '#' + next.id;
    nl.querySelector('span').textContent = `${shortRows(next) === '—' ? '' : shortRows(next) + ' · '}${next.title}`;
  } else {
    nl.href = '#index';
    nl.querySelector('span').textContent = 'Back to index';
  }
}

function route() {
  const id = (location.hash || '').slice(1);
  const idx = CASES.findIndex((c) => c.id === id);
  $('jumpMsg').hidden = true;
  if (idx < 0) renderIndex();
  else { renderCase(CASES[idx]); setPager(idx); }
  window.scrollTo(0, 0);
}

/* events */
document.addEventListener('click', (e) => {
  const tick = e.target.closest('.tick');
  if (tick) {
    const li = tick.closest('li'); const cid = tick.closest('ol').dataset.case; const i = +li.dataset.i;
    const arr = done[cid] || []; arr[i] = !arr[i]; done[cid] = arr; store.set('eo-demo-done', done);
    li.classList.toggle('done', !!arr[i]); tick.setAttribute('aria-pressed', arr[i] ? 'true' : 'false');
    return;
  }
  const v = e.target.closest('[data-copy]');
  if (v) copyVal(v);
});
document.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[data-copy]')) { e.preventDefault(); copyVal(e.target); }
});
function copyVal(el) {
  const text = el.dataset.copy;
  const flash = () => { el.classList.add('copied'); setTimeout(() => el.classList.remove('copied'), 700); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try {
    navigator.clipboard.writeText(text).then(flash, fallback);
  } catch { fallback(); }
}
$('homeBtn').onclick = () => { location.hash = 'index'; };
$('jumpForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const n = parseInt($('jumpInput').value, 10);
  const c = CASES.find((x) => x.rows.includes(n));
  if (c) { $('jumpInput').value = ''; $('jumpInput').blur(); if (location.hash === '#' + c.id) route(); else location.hash = c.id; }
  else { $('jumpMsg').textContent = 'No checklist row ' + (isNaN(n) ? 'with that number' : n) + '. Rows run 1 to 69.'; $('jumpMsg').hidden = false; }
});
window.addEventListener('hashchange', route);
route();
</script>
